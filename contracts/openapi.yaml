    ScoreBreakdown:
      type: object
      required: [total, band, confidence, components]
      properties:
        total: { type: number, minimum: 0, maximum: 100 }
        band: { $ref: "#/components/schemas/Band" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        capped: { type: boolean, default: false }
        components:
          type: array
          items: { $ref: "#/components/schemas/ScoreComponent" }
      examples: [*ex_score]

    ScoreComponent:
      type: object
      required: [key, label, weight, score, contribution, reasons]
      properties:
        key: { type: string, enum: [skill_evidence, project_quality, consistency, experience, resume_quality] }
        label: { type: string }
        weight: { type: number, description: Effective weight after reweighting }
        score: { type: [number, "null"], description: "0-100, null when no data" }
        contribution: { type: number, description: weight × score }
        reasons:
          type: array
          items:
            type: object
            required: [text, delta]
            properties:
              text: { type: string, examples: ["Docker verified in repo 'campus-api' (11 authored commits)"] }
              delta: { type: number, description: Points gained (+) or withheld (-) inside this component }
              evidence_ids: { type: array, items: { type: string } }

    Evidence:
      type: object
      required: [id, kind, source, label]
      properties:
        id: { type: string }
        kind: { type: string, enum: [repo, file, commit_range, portfolio_item, experience, resume_text, linkedin, certificate] }
        source: { type: string, enum: [github, resume, linkedin, portfolio] }
        label: { type: string }
        url: { type: [string, "null"], format: uri }
        details: { type: [object, "null"] }

    SkillClaim:
      type: object
      required: [skill_id, skill_name, claimed, level, reason, evidence_ids]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        claimed: { type: boolean }
        level: { $ref: "#/components/schemas/EvidenceLevel" }
        reason: { type: string }
        evidence_ids: { type: array, items: { type: string } }
      examples: [*ex_claim]

    SkillGap:
      type: object
      required: [gap_id, skill_id, skill_name, importance, claimed, level, estimated_gain]
      properties:
        gap_id: { type: string }
        skill_id: { type: string }
        skill_name: { type: string }
        importance: { type: integer, minimum: 1, maximum: 3 }
        claimed: { type: boolean, description: "true = on the resume but under-evidenced; false = not claimed" }
        level: { $ref: "#/components/schemas/EvidenceLevel" }
        estimated_gain: { type: number }

    ProjectFlag:
      type: object
      required: [flag_id, code, severity, reason, fix, estimated_gain]
      properties:
        flag_id: { type: string }
        code: { type: string, enum: [single_dump, unmodified_fork, default_readme, tutorial_pattern, thin_wrapper, claim_mismatch, vague_description, understanding_gap] }
        severity: { type: string, enum: [low, medium, high] }
        reason: { type: string }
        fix: { type: string }
        estimated_gain: { type: number }

    ProjectAudit:
      type: object
      required: [project_id, title, kind, score, counted_in_score, detected_skills, flags, self_reported]
      properties:
        project_id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [code, design] }
        url: { type: [string, "null"], format: uri, description: Repository URL (code) or portfolio page URL (design) }
        demo_url: { type: [string, "null"], format: uri }
        score: { type: number, minimum: 0, maximum: 100 }
        counted_in_score: { type: boolean, description: One of the top 3 projects by role relevance used for the project_quality component }
        subscores:
          type: [object, "null"]
          description: "Code projects only. Maxima: hygiene 20, engineering 30, authorship 30, depth 20"
          properties:
            hygiene: { type: number }
            engineering: { type: number }
            authorship: { type: number }
            depth: { type: number }
        design_subscores:
          type: [object, "null"]
          description: "Design projects only. Maxima: 25, 30, 20, 15, 10"
          properties:
            problem_statement: { type: number }
            process_evidence: { type: number }
            outcome_or_metrics: { type: number }
            tool_evidence: { type: number }
            presentation: { type: number }
        signals:
          type: [object, "null"]
          description: Code projects only. Boolean keys match SimulationRequest add_signals.
          required: [tests, ci, demo_url, license, readme, deploy_config, authored_commits, total_commits]
          properties:
            tests: { type: boolean }
            ci: { type: boolean }
            demo_url: { type: boolean }
            license: { type: boolean }
            readme: { type: boolean }
            deploy_config: { type: boolean }
            authored_commits: { type: integer }
            total_commits: { type: integer }
        detected_skills: { type: array, items: { type: string } }
        what_it_does: { type: [string, "null"] }
        honest_rewrite: { type: [string, "null"] }
        issues:
          type: array
          description: From the project judgement (PIPELINE stage 5); each issue comes with a fix
          items:
            type: object
            required: [issue, fix]
            properties:
              issue: { type: string }
              fix: { type: string }
        flags: { type: array, items: { $ref: "#/components/schemas/ProjectFlag" } }
        self_reported: { type: boolean, description: true for link-based design evidence (capped at 80) }
        understanding:
          $ref: "#/components/schemas/Understanding"
          description: From the latest verify quiz on this project (stored per project on the profile, carried across analyses)
        latest_quiz_id: { type: [string, "null"], format: uuid }
      examples: [*ex_project]

    RoleFit:
      type: object
      required: [role_id, role_name, score, reasons, top_missing]
      properties:
        role_id: { type: string }
        role_name: { type: string }
        score: { type: number }
        reasons: { type: array, items: { type: string } }
        top_missing: { type: array, items: { type: string }, description: Skill display names }

    RoadmapMilestone:
      type: object
      required: [id, order, title, deliverable, addresses, resources, effort_hours, estimated_gain]
      properties:
        id: { type: string }
        order: { type: integer }
        title: { type: string }
        deliverable: { type: string }
        addresses: { type: array, items: { type: string }, description: gap_ids / flag_ids }
