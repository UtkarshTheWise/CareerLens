        effort_hours: { type: integer }
        estimated_gain: { type: number }
        done: { type: boolean, default: false }
      examples: [*ex_milestone]

    ConsistencySummary:
      type: object
      required: [weeks, active_weeks, score]
      properties:
        weeks:
          type: array
          items:
            type: object
            required: [week_start, count]
            properties:
              week_start: { type: string, format: date }
              count: { type: integer }
        active_weeks: { type: integer }
        cv: { type: [number, "null"] }
        last_active_date: { type: [string, "null"], format: date }
        score: { type: number }

    SimulationRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              project_id: { type: [string, "null"] }
              add_signals:
                type: array
                items: { type: string, enum: [tests, ci, demo_url, license, readme, deploy_config] }
              resolve_flags: { type: array, items: { type: string } }
              set_understanding:
                oneOf:
                  - $ref: "#/components/schemas/Understanding"
                  - type: "null"
              set_skill_level:
                type: [object, "null"]
                properties:
                  skill_id: { type: string }
                  level: { $ref: "#/components/schemas/EvidenceLevel" }

    SimulationResult:
      type: object
      required: [before, after, delta]
      properties:
        before: { $ref: "#/components/schemas/ScoreBreakdown" }
        after: { $ref: "#/components/schemas/ScoreBreakdown" }
        delta: { type: number }

