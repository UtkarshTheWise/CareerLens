      properties:
        project_id: { type: string }
        mode: { $ref: "#/components/schemas/QuizMode" }
        question_count: { type: integer, minimum: 3, maximum: 10, description: "Verify mode is fixed at 6; practice defaults to 8" }

    QuizQuestion:
      type: object
      required: [id, order, type, category, prompt, skill_ids]
      properties:
        id: { type: string }
        order: { type: integer }
        type: { type: string, enum: [mcq, short_answer] }
        category: { type: string, enum: [code_reading, architecture, design_decision, debugging, extension, claim_check, process, outcome, critique] }
        prompt: { type: string }
        code_snippet:
          type: [object, "null"]
          required: [path, start_line, end_line, code]
          properties:
            path: { type: string }
            start_line: { type: integer }
            end_line: { type: integer }
            code: { type: string }
            language: { type: [string, "null"] }
        options:
          type: array
          description: MCQ only
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string }
              text: { type: string }
        hint: { type: [string, "null"], description: Practice mode only }
        time_limit_s: { type: [integer, "null"], description: Verify mode only }
        served_at: { type: [string, "null"], format: date-time }
        time_remaining_s: { type: [integer, "null"], description: "Verify mode, current question only: seconds left as computed by the server at response time" }
        answered: { type: boolean, default: false }
        skill_ids: { type: array, items: { type: string } }

    Quiz:
      type: object
      required: [id, analysis_id, project_id, project_title, mode, status, questions, total_questions, created_at]
      properties:
        id: { type: string, format: uuid }
        analysis_id: { type: string, format: uuid }
        project_id: { type: string }
        project_title: { type: string }
        mode: { $ref: "#/components/schemas/QuizMode" }
        status: { $ref: "#/components/schemas/QuizStatus" }
        total_questions: { type: integer }
        questions: { type: array, items: { $ref: "#/components/schemas/QuizQuestion" } }
        created_at: { type: string, format: date-time }

    QuizAnswer:
      type: object
      required: [question_id, time_taken_ms]
      properties:
        question_id: { type: string }
        choice_id: { type: [string, "null"], description: MCQ }
        text: { type: [string, "null"], description: "Short answer, max 2000 chars" }
        time_taken_ms: { type: integer }
        focus_lost_count: { type: integer, default: 0 }

    KeyPointResult:
      type: object
      required: [text, status]
      properties:
        text: { type: string }
        status: { type: string, enum: [covered, partial, missing] }

    QuizAnswerFeedback:
      type: object
      required: [question_id, recorded]
      description: |
        Verify mode before submit: only question_id, recorded and timed_out are set; every grading and
        answer-key field is null or empty. Practice mode and QuizResult.per_question: all fields set.
      properties:
        question_id: { type: string }
        recorded: { type: boolean }
        timed_out: { type: boolean, default: false }
        choice_id: { type: [string, "null"], description: The student's own MCQ answer }
        text: { type: [string, "null"], description: The student's own short answer }
        score: { type: [number, "null"], description: "0-1; null in verify mode until submitted" }
        correct_choice_id: { type: [string, "null"] }
        key_points: { type: array, items: { $ref: "#/components/schemas/KeyPointResult" } }
        incorrect_statements: { type: array, items: { type: string } }
        feedback: { type: [string, "null"] }
        model_answer: { type: [string, "null"] }
        source_ref:
          oneOf:
            - $ref: "#/components/schemas/SourceRef"
            - type: "null"

    QuizResult:
      type: object
      required: [quiz_id, mode, score, understanding, per_question, review_topics, strengths]
      properties:
        quiz_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/QuizMode" }
        score: { type: number, minimum: 0, maximum: 100 }
        understanding:
          description: Set in verify mode only; null for practice (practice never changes evidence)
          oneOf:
            - $ref: "#/components/schemas/Understanding"
            - type: "null"
        per_question: { type: array, items: { $ref: "#/components/schemas/QuizAnswerFeedback" } }
        strengths: { type: array, items: { type: string } }
        review_topics:
          type: array
          items:
            type: object
            required: [topic]
            properties:
              topic: { type: string }
              source_ref:
                oneOf:
                  - $ref: "#/components/schemas/SourceRef"
                  - type: "null"
        focus_lost_total: { type: integer, description: Shown to the student only }
        flag:
          oneOf:
            - $ref: "#/components/schemas/ProjectFlag"
            - type: "null"
        score_update:
          oneOf:
            - $ref: "#/components/schemas/SimulationResult"
            - type: "null"
        retake_available_at: { type: [string, "null"], format: date-time }

    QuizSummary:
      type: object
      required: [id, project_id, project_title, mode, status, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string }
        project_title: { type: string }
        mode: { $ref: "#/components/schemas/QuizMode" }
        status: { $ref: "#/components/schemas/QuizStatus" }
        score: { type: [number, "null"] }
        understanding:
          oneOf:
            - $ref: "#/components/schemas/Understanding"
            - type: "null"
        created_at: { type: string, format: date-time }

    # ---------- jobs & applications ----------
    JobPosting:
      type: object
      required: [title, description, source]
      properties:
        title: { type: string }
        company: { type: [string, "null"] }
        location: { type: [string, "null"] }
        url: { type: [string, "null"], format: uri }
        description: { type: string, description: "Plain text, max 20k chars" }
        required_skills: { type: array, items: { type: string } }
        nice_to_have: { type: array, items: { type: string } }
        deadline: { type: [string, "null"], format: date }
        source: { type: string, enum: [jsonld, dom, llm, manual] }

    JobMatch:
      type: object
      required: [keyword_match, evidence_match, matched, missing, unverified, summary]
      properties:
        keyword_match: { type: number, minimum: 0, maximum: 100 }
        evidence_match: { type: number, minimum: 0, maximum: 100 }
        matched:
          type: array
          items:
            type: object
            required: [skill_id, skill_name, level]
            properties:
              skill_id: { type: string }
              skill_name: { type: string }
              level: { $ref: "#/components/schemas/EvidenceLevel" }
        missing: { type: array, items: { type: string }, description: Skill display names required by the posting with no claim or evidence }
        unverified: { type: array, items: { type: string }, description: Skill display names claimed at weak or unverified }
        summary: { type: string }
        normalized_posting: { $ref: "#/components/schemas/JobPosting" }
      examples:
        - keyword_match: 85.7
          evidence_match: 60
          matched:
            - { skill_id: python, skill_name: Python, level: strong }
            - { skill_id: fastapi, skill_name: FastAPI, level: strong }
            - { skill_id: sql, skill_name: SQL, level: strong }
            - { skill_id: docker, skill_name: Docker, level: strong }
            - { skill_id: kubernetes, skill_name: Kubernetes, level: unverified }
            - { skill_id: aws, skill_name: AWS, level: unverified }
          missing: [Redis]
          unverified: [Kubernetes, AWS]
          summary: "You mention 6 of the 7 required skills and 4 are backed by your own repositories. Kubernetes and AWS are claimed without evidence yet; Redis is not on your profile."
          normalized_posting:
            title: Backend Engineer Intern
            company: Northwind Labs
            location: Chennai, India
            url: null
            description: "We are looking for a backend intern to build and maintain REST APIs in Python (FastAPI) on PostgreSQL, packaged with Docker and deployed to Kubernetes on AWS. Experience with Redis caching is required."
            required_skills: [Python, FastAPI, SQL, Docker, Kubernetes, AWS, Redis]
            nice_to_have: []
            deadline: null
            source: jsonld

    ApplicationStatus: { type: string, enum: [saved, applied, interviewing, offer, rejected] }

    ApplicationCreate:
      type: object
      required: [profile_id, company, title]
      properties:
        profile_id: { type: string, format: uuid }
        company: { type: string }
        title: { type: string }
        url: { type: [string, "null"], format: uri }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        deadline: { type: [string, "null"], format: date }
        keyword_match: { type: [number, "null"] }
        evidence_match: { type: [number, "null"] }
        description: { type: [string, "null"] }
        notes: { type: [string, "null"] }

    ApplicationUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        deadline: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        applied_at: { type: [string, "null"], format: date-time }

    Application:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            applied_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    TailoredResume:
      type: object
      required: [bullets, numbers_without_evidence, skills_order]
      properties:
        bullets:
          type: array
          items:
            type: object
            required: [original, rewritten]
            properties:
              original: { type: string }
              rewritten: { type: string }
              evidence_ids: { type: array, items: { type: string } }
        numbers_without_evidence: { type: array, items: { type: string } }
        skills_order: { type: array, items: { type: string } }

    # ---------- cohorts ----------
    Cohort:
      type: object
      required: [id, name, student_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ["B.Tech CSE 2027"] }
        department: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        student_count: { type: integer }
      examples:
        - id: 6b1f4c2a-9d3e-4f7a-8c55-2e0a7d9b1c44
          name: B.Tech CSE 2027
          department: CSE
          year: 2027
          student_count: 40

    CohortInsights:
      type: object
      required: [cohort_id, role_id, student_count, analysed_count, median_score, bands, histogram, top_missing_skills, unverified_rate_by_skill, at_risk_count]
      properties:
        cohort_id: { type: string, format: uuid }
        role_id: { type: string }
        student_count: { type: integer }
        analysed_count: { type: integer }
        median_score: { type: [number, "null"] }
        median_coverage: { type: [number, "null"] }
        bands:
          type: object
          required: [not_ready, developing, ready]
          properties:
            not_ready: { type: integer }
            developing: { type: integer }
            ready: { type: integer }
        histogram:
          type: array
          items:
            type: object
            required: [bucket, count]
            properties:
              bucket: { type: string, examples: ["50-59"] }
              count: { type: integer }
        top_missing_skills:
          type: array
          items:
            type: object
            required: [skill_id, skill_name, students]
            properties:
              skill_id: { type: string }
              skill_name: { type: string }
              students: { type: integer }
        unverified_rate_by_skill:
          type: array
          items:
            type: object
            required: [skill_id, skill_name, claimed_by, unverified_rate]
            properties:
              skill_id: { type: string }
              skill_name: { type: string }
              claimed_by: { type: integer }
              unverified_rate: { type: number, minimum: 0, maximum: 100 }
        at_risk_count: { type: integer }
        understanding:
          type: object
          required: [quizzed, demonstrated, partial, not_demonstrated]
          description: Based on each student's top project, latest verify quiz
          properties:
            quizzed: { type: integer }
            demonstrated: { type: integer }
            partial: { type: integer }
            not_demonstrated: { type: integer }
            by_skill:
              type: array
              description: Share of students claiming the skill whose claim is built (strong/moderate) AND explained (demonstrated quiz on a project that backs that skill)
              items:
                type: object
                required: [skill_id, skill_name, claimed_by, built_and_explained_rate]
                properties:
                  skill_id: { type: string }
                  skill_name: { type: string }
                  claimed_by: { type: integer }
                  built_and_explained_rate: { type: number, minimum: 0, maximum: 100 }
        by_department:
          type: array
          items:
            type: object
            required: [department, students, median_score]
            properties:
              department: { type: string }
              students: { type: integer }
              median_score: { type: [number, "null"] }
      examples:
        - cohort_id: 6b1f4c2a-9d3e-4f7a-8c55-2e0a7d9b1c44
          role_id: sde-backend
          student_count: 40
          analysed_count: 38
          median_score: 56.5
          median_coverage: 48
          bands: { not_ready: 12, developing: 20, ready: 6 }
          histogram:
            - { bucket: "0-9", count: 0 }
            - { bucket: "10-19", count: 0 }
            - { bucket: "20-29", count: 2 }
            - { bucket: "30-39", count: 4 }
            - { bucket: "40-49", count: 6 }
            - { bucket: "50-59", count: 10 }
            - { bucket: "60-69", count: 7 }
            - { bucket: "70-79", count: 6 }
            - { bucket: "80-89", count: 3 }
            - { bucket: "90-100", count: 0 }
          top_missing_skills:
            - { skill_id: ci-cd, skill_name: CI/CD, students: 24 }
            - { skill_id: redis, skill_name: Redis, students: 21 }
            - { skill_id: kubernetes, skill_name: Kubernetes, students: 19 }
            - { skill_id: system-design, skill_name: System Design, students: 17 }
            - { skill_id: aws, skill_name: AWS, students: 15 }
          unverified_rate_by_skill:
            - { skill_id: kubernetes, skill_name: Kubernetes, claimed_by: 14, unverified_rate: 78.6 }
            - { skill_id: aws, skill_name: AWS, claimed_by: 16, unverified_rate: 68.8 }
            - { skill_id: docker, skill_name: Docker, claimed_by: 22, unverified_rate: 36.4 }
            - { skill_id: react, skill_name: React, claimed_by: 18, unverified_rate: 33.3 }
            - { skill_id: sql, skill_name: SQL, claimed_by: 34, unverified_rate: 17.6 }
          at_risk_count: 14
          understanding:
            quizzed: 15
            demonstrated: 8
            partial: 4
            not_demonstrated: 3
            by_skill:
              - { skill_id: python, skill_name: Python, claimed_by: 36, built_and_explained_rate: 19.4 }
              - { skill_id: sql, skill_name: SQL, claimed_by: 34, built_and_explained_rate: 14.7 }
              - { skill_id: docker, skill_name: Docker, claimed_by: 22, built_and_explained_rate: 13.6 }
          by_department:
            - { department: CSE, students: 24, median_score: 58.2 }
            - { department: IT, students: 10, median_score: 54 }
            - { department: ECE, students: 6, median_score: 47.5 }

    CohortStudent:
      type: object
      required: [profile_id, name, score, band, coverage, at_risk]
      properties:
        profile_id: { type: string, format: uuid }
        name: { type: string }
        github_username: { type: [string, "null"] }
        analysis_id: { type: string, format: uuid, description: The analysis this row is computed from }
        department: { type: [string, "null"] }
        score: { type: number }
        band: { $ref: "#/components/schemas/Band" }
        coverage: { type: number }
        top_gap: { type: [string, "null"], description: Skill display name }
        at_risk: { type: boolean }
        understanding:
          $ref: "#/components/schemas/Understanding"
          description: Latest verify result on the student's top project for this role
        matched_skills:
          type: array
          description: Requested skills this student matched, in request order. Empty when no skill filter is sent.
          items: { $ref: "#/components/schemas/MatchedSkill" }
      examples:
        - profile_id: 3f2b8c1e-5d47-4a9b-8e21-7c6a0f9d1b34
          name: Demo Student
          github_username: careerlens-demo
          analysis_id: 9a7d2e40-1c3b-4f58-b6a9-0d5e8c2f7a11
          department: CSE
          score: 65.1
          band: developing
          coverage: 62.5
          top_gap: CI/CD
          at_risk: false
          understanding: not_taken
          matched_skills: []

    MatchedSkill:
      type: object
      required: [skill_id, skill_name, level]
      properties:
        skill_id: { type: string }
        skill_name: { type: string }
        level: { $ref: "#/components/schemas/EvidenceLevel" }
