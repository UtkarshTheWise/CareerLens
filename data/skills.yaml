# Skill catalogue. Format: docs/SCORING.md §4. Validated by apps/api/app/catalogue.py.
#
# aliases   matched case- and punctuation-insensitively ("React.js" == "reactjs"); the id and
#           name are aliases automatically. An alias may belong to one skill only.
# detectors npm | pip | maven | gradle (package names) · files (exact file names anywhere) ·
#           paths (directory prefixes) · extensions · content {glob, regex} · imports {lang, modules}
#           `detectors: {}` = no repository footprint; evidence comes from experience bullets,
#           portfolio case studies and project descriptions (SCORING §1), not from a detector.
skills:
  # ---------- languages ----------
  - id: python
    name: Python
    aliases: [python3, py]
    category: language
    detectors:
      extensions: [.py]
      files: [requirements.txt, pyproject.toml, setup.py, Pipfile]

  - id: javascript
    name: JavaScript
    aliases: [js, es6, ecmascript, vanilla js]
    category: language
    detectors:
      extensions: [.js, .mjs, .cjs, .jsx]

  - id: typescript
    name: TypeScript
    aliases: [ts]
    category: language
    detectors:
      npm: [typescript]
      extensions: [.ts, .tsx]
      files: [tsconfig.json]

  - id: java
    name: Java
    aliases: [core java, java se, jdk]
    category: language
    detectors:
      extensions: [.java]
      files: [pom.xml, build.gradle, build.gradle.kts]

  - id: cpp
    name: C++
    aliases: [c++, cplusplus, c/c++]
    category: language
    detectors:
      extensions: [.cpp, .cc, .cxx, .hpp]
      files: [CMakeLists.txt]

  - id: go
    name: Go
    aliases: [golang]
    category: language
    detectors:
      extensions: [.go]
      files: [go.mod]

  - id: sql
    name: SQL
    aliases: [mysql, postgresql, postgres, sqlite, rdbms, relational databases, pl/sql]
    category: language
    detectors:
      extensions: [.sql]
      pip: [sqlalchemy, psycopg, psycopg2, psycopg2-binary, pymysql, mysqlclient, sqlmodel, asyncpg]
      npm: [pg, mysql2, prisma, "@prisma/client", drizzle-orm, sequelize, typeorm, knex]
      maven: [mysql-connector-j, postgresql, spring-boot-starter-data-jpa]

  - id: html-css
    name: HTML & CSS
    aliases: [html, css, html5, css3, html/css, sass, scss]
    category: language
    detectors:
      extensions: [.html, .css, .scss, .sass]

  - id: bash
    name: Bash
    aliases: [shell, shell scripting, bash scripting, sh]
    category: language
    detectors:
      extensions: [.sh, .bash]

  # ---------- backend ----------
  - id: nodejs
    name: Node.js
    aliases: [node, node js]
    category: backend
    detectors:
      npm: [express, fastify, koa, "@nestjs/core", hapi, nodemon]
      files: [.nvmrc]

  - id: express
    name: Express
    aliases: [expressjs, express.js]
    category: backend
    detectors:
      npm: [express]

  - id: fastapi
    name: FastAPI
    aliases: [fast api]
    category: backend
    detectors:
      pip: [fastapi]
      imports: { lang: python, modules: [fastapi] }

  - id: django
    name: Django
    aliases: [django rest framework, drf]
    category: backend
    detectors:
      pip: [django, djangorestframework]
      files: [manage.py]

  - id: flask
    name: Flask
    aliases: []
    category: backend
    detectors:
      pip: [flask]
      imports: { lang: python, modules: [flask] }

  - id: spring-boot
    name: Spring Boot
    aliases: [spring, springboot, spring framework, spring mvc]
    category: backend
    detectors:
      maven: [spring-boot-starter, spring-boot-starter-web, spring-boot-starter-parent]
      gradle: [org.springframework.boot]

  - id: rest-api
    name: REST APIs
    aliases: [rest, restful apis, restful api, rest api, api development, web apis]
    category: backend
    detectors:
      pip: [fastapi, flask, djangorestframework]
      npm: [express, fastify, koa, "@nestjs/core"]
      maven: [spring-boot-starter-web]
      files: [openapi.yaml, openapi.json, swagger.yaml, swagger.json]

  - id: graphql
    name: GraphQL
    aliases: [gql, apollo]
    category: backend
    detectors:
      npm: [graphql, "@apollo/server", "@apollo/client", apollo-server]
      pip: [graphene, strawberry-graphql, ariadne]
      extensions: [.graphql, .gql]

  - id: mongodb
    name: MongoDB
    aliases: [mongo, mongoose, nosql]
    category: backend
    detectors:
      npm: [mongodb, mongoose]
      pip: [pymongo, motor, mongoengine]

  - id: redis
    name: Redis
    aliases: [redis cache, caching]
    category: backend
    detectors:
      pip: [redis, aioredis, celery]
      npm: [redis, ioredis, bullmq]
      content: { glob: "*compose*.y*ml", regex: "image:\\s*redis" }

  - id: pytest
    name: pytest
    aliases: [unit testing in python, python testing]
    category: backend
    detectors:
      pip: [pytest]
      files: [pytest.ini, conftest.py]

  - id: jest
    name: Jest
    aliases: [javascript testing, vitest, react testing library]
    category: backend
    detectors:
      npm: [jest, vitest, "@testing-library/react"]
      files: [jest.config.js, jest.config.ts, vitest.config.ts, vitest.config.js]

  - id: system-design
    name: System Design
    aliases: [software architecture, scalable systems, distributed systems, hld, lld]
    category: backend
    detectors: {}

  # ---------- frontend ----------
  - id: react
