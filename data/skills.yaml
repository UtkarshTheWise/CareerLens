  # ---------- devops & cloud ----------
  - id: git
    name: Git
    aliases: [github, version control, gitlab, git/github]
    category: devops
    detectors:
      files: [.gitignore, .gitattributes]

  - id: docker
    name: Docker
    aliases: [containerization, containers, docker compose, docker-compose]
    category: devops
    detectors:
      files: [Dockerfile, docker-compose.yml, docker-compose.yaml, compose.yaml, compose.yml, .dockerignore]

  - id: kubernetes
    name: Kubernetes
    aliases: [k8s, helm, kubectl]
    category: devops
    detectors:
      files: [Chart.yaml, kustomization.yaml]
      paths: ["k8s/", "helm/", "manifests/"]
      content: { glob: "*.y*ml", regex: "kind:\\s*(Deployment|Service|Ingress|StatefulSet)" }

  - id: ci-cd
    name: CI/CD
    aliases: [ci cd, cicd, continuous integration, continuous delivery, github actions, jenkins, gitlab ci]
    category: devops
    detectors:
      files: [.gitlab-ci.yml, Jenkinsfile, .travis.yml, azure-pipelines.yml, bitbucket-pipelines.yml]
      paths: [".github/workflows/", ".circleci/"]

  - id: aws
    name: AWS
    aliases: [amazon web services, ec2, s3, aws lambda, lambda]
    category: devops
    detectors:
      pip: [boto3, aws-cdk-lib, awscli]
      npm: [aws-sdk, aws-cdk-lib, "@aws-sdk/client-s3", serverless]
      files: [serverless.yml, samconfig.toml, buildspec.yml]
      content: { glob: "*.tf", regex: "provider\\s+\"aws\"" }

  - id: gcp
    name: Google Cloud
    aliases: [google cloud platform, gcloud, firebase, cloud run, bigquery]
    category: devops
    detectors:
      pip: [google-cloud-storage, google-cloud-bigquery, firebase-admin, google-cloud-firestore]
      npm: [firebase, firebase-admin, "@google-cloud/storage"]
      files: [app.yaml, cloudbuild.yaml, firebase.json]

  - id: azure
    name: Microsoft Azure
    aliases: [ms azure, azure devops, azure functions]
    category: devops
    detectors:
      pip: [azure-identity, azure-storage-blob, azure-functions]
      npm: ["@azure/identity", "@azure/storage-blob"]
      files: [azure-pipelines.yml, host.json]

  - id: terraform
    name: Terraform
    aliases: [infrastructure as code, iac, opentofu]
    category: devops
    detectors:
      extensions: [.tf]
      files: [terraform.tfvars, .terraform.lock.hcl]

  - id: linux
    name: Linux
    aliases: [unix, ubuntu, linux administration, command line, cli]
    category: devops
    detectors:
      files: [Makefile]
      extensions: [.service]

  - id: nginx
    name: Nginx
    aliases: [reverse proxy, load balancing]
    category: devops
    detectors:
      files: [nginx.conf, Caddyfile]
      content: { glob: "*compose*.y*ml", regex: "image:\\s*nginx" }

  - id: monitoring
    name: Monitoring & Logging
    aliases: [prometheus, grafana, observability, logging, elk, opentelemetry]
    category: devops
    detectors:
      pip: [prometheus-client, opentelemetry-sdk, sentry-sdk, structlog]
      npm: [prom-client, "@sentry/node", "@opentelemetry/api", winston, pino]
      files: [prometheus.yml]

