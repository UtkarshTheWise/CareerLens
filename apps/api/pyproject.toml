[project]
name = "careerlens-api"
version = "0.2.0"
description = "CareerLens backend: evidence-based employability analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "google-genai>=2.28.0",
    "groq>=1.7.0",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits real external services (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures embed long README and JSON strings
