# Render blueprint for the CareerLens API (free web service).
# No secret lives in this file: every key with `sync: false` is typed into the Render dashboard.
# Free instances sleep after ~15 min idle and take about a minute to wake: the daily keep-alive workflow
# (.github/workflows/keepalive.yml) and a /health call before a demo cover that.
services:
  - type: web
    name: careerlens-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production # refuses to start with DEV_AUTH=1 or without a token key
      - key: DEV_AUTH
        value: "0"
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # --- secrets and per-deployment values: set in the dashboard ---
      - key: DATABASE_URL # Supabase session-pooler string, postgresql://... (the app rewrites the driver)
        sync: false
      - key: SUPABASE_JWT_SECRET # HS256 projects (Project Settings > API > JWT secret)
        sync: false
      - key: SUPABASE_URL # asymmetric-key projects: https://<ref>.supabase.co (tokens checked via JWKS)
        sync: false
      - key: PLACEMENT_STAFF # comma-separated emails or user ids allowed to see cohort data
        sync: false
      - key: CORS_ORIGINS # the web app's origin, e.g. https://careerlens.vercel.app
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
